version: '3.8'

services:
  # Static site with nginx
  web:
    build: .
    container_name: tuto-openclaw-site
    ports:
      - "8106:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
