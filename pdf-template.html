<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutoriel OpenClaw Complet</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 100%;
        }
        
        /* Cover Page */
        .cover {
            page-break-after: always;
            text-align: center;
            padding-top: 100px;
        }
        
        .cover-logo {
            max-width: 400px;
            margin-bottom: 60px;
        }
        
        .cover h1 {
            font-size: 42px;
            color: #7451eb;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .cover h2 {
            font-size: 24px;
            color: #666;
            font-weight: 400;
            margin-bottom: 40px;
        }
        
        .cover-meta {
            margin-top: 100px;
            font-size: 14px;
            color: #999;
        }
        
        /* Content */
        h1 {
            font-size: 32px;
            color: #7451eb;
            border-bottom: 3px solid #7451eb;
            padding-bottom: 10px;
            margin-top: 40px;
            page-break-after: avoid;
        }
        
        h2 {
            font-size: 24px;
            color: #333;
            margin-top: 30px;
            page-break-after: avoid;
        }
        
        h3 {
            font-size: 20px;
            color: #555;
            margin-top: 25px;
        }
        
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        pre {
            background: #1a1a2e;
            color: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85em;
            line-height: 1.5;
        }
        
        pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background: #7451eb;
            color: white;
        }
        
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        
        blockquote {
            border-left: 4px solid #7451eb;
            margin: 20px 0;
            padding: 15px 20px;
            background: #f8f9fa;
            font-style: italic;
        }
        
        ul, ol {
            margin: 15px 0;
            padding-left: 30px;
        }
        
        li {
            margin: 8px 0;
        }
        
        .page-break {
            page-break-before: always;
        }
    </style>
</head>
<body>
    <!-- Cover Page -->
    <div class="cover">
        <img src="logo-stephane.jpg" alt="Stephane Quentin" class="cover-logo">
        <h1>Tutoriel OpenClaw</h1>
        <h2>Maîtrisez le développement d'applications assistées par IA</h2>
        <div class="cover-meta">
            <p>Version 2026</p>
            <p>Par Stephane Quentin</p>
        </div>
    </div>

    <!-- Content will be inserted here -->
    <div id="content"></div>

</body>
</html>
